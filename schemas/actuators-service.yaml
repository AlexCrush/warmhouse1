openapi: 3.0.3
info:
  title: actuators-service
  description: Команды свету и воротам/замкам.
  version: 1.0.0
servers:
  - url: http://actuators-service:8080
paths:
  /api/v1/actuators/{deviceId}/commands:
    post:
      summary: Отправить команду актуатору
      operationId: sendActuatorCommand
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActuatorCommandRequest'
            examples:
              closeGate:
                value:
                  actuator_kind: gate
                  command_type: close
                  connector_ref: "partner://gate/GT-77"
              lightOn:
                value:
                  actuator_kind: light
                  command_type: on
                  connector_ref: "partner://light/LT-12"
      responses:
        '200':
          description: Delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
              example:
                command_id: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                device_id: "1b671a64-40d5-491e-99b0-da01ff1f3341"
                status: succeeded
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Delivery failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: Timeout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/actuators/{deviceId}/state:
    get:
      summary: Текущее состояние актуатора
      operationId: getActuatorState
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorState'
              example:
                device_id: "1b671a64-40d5-491e-99b0-da01ff1f3341"
                actuator_kind: gate
                state: closed
                updated_at: "2026-10-02T17:06:00Z"
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    ActuatorCommandRequest:
      type: object
      required: [actuator_kind, command_type, connector_ref]
      properties:
        actuator_kind: { type: string, enum: [light, gate] }
        command_type: { type: string, enum: [on, off, open, close] }
        connector_ref: { type: string }
    CommandResult:
      type: object
      required: [command_id, device_id, status]
      properties:
        command_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        status: { type: string, enum: [succeeded, failed] }
    ActuatorState:
      type: object
      required: [device_id, actuator_kind, state, updated_at]
      properties:
        device_id: { type: string, format: uuid }
        actuator_kind: { type: string, enum: [light, gate] }
        state: { type: string }
        updated_at: { type: string, format: date-time }
